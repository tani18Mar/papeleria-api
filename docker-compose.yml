services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: papeleria
      POSTGRES_USER: papeleria
      POSTGRES_PASSWORD: papeleria_local
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U papeleria -d papeleria"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    environment:
      PORT: 3000
      DATABASE_URL: postgres://papeleria:papeleria_local@db:5432/papeleria
      NODE_ENV: production
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
